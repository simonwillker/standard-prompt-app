{
  "schema_version": 1,
  "template": {
    "id": "email-reply",
    "name": "客户邮件回复",
    "version": "1.0.0",
    "category": "文书",
    "tags": [
      "标准化"
    ],
    "description": "把用户提供的业务内容整理为可复用的固定结构"
  },
  "prompt": {
    "role": "严谨的业务文书助手",
    "task": "根据来信起草客户邮件回复，使用 {{output_language}} 输出",
    "input_spec": "用户提供的业务文本；不要添加原文没有的事实",
    "variables": [
      {
        "key": "content",
        "label": "输入正文",
        "type": "textarea",
        "placement": "input",
        "required": true
      },
      {
        "key": "output_language",
        "label": "输出语言",
        "type": "select",
        "placement": "inline",
        "required": true,
        "default": "zh-CN",
        "options": [
          "zh-CN",
          "ja-JP",
          "en-US"
        ]
      }
    ],
    "output": {
      "type": "text",
      "template": "称呼：\n\n回复正文：\n\n下一步：\n\n署名："
    },
    "examples": [],
    "constraints": [
      "不添加输入中没有的事实",
      "保留重要的人名、日期和业务条件"
    ],
    "missing_info": {
      "policy": "mark_unknown",
      "value": "不明"
    }
  },
  "metadata": {
    "created_at": "2026-10-03",
    "updated_at": "2026-10-03"
  }
}
